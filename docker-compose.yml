version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: orca-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orca_marine}
      POSTGRES_USER: ${POSTGRES_USER:-orca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca_user} -d ${POSTGRES_DB:-orca_marine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orca-backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_REASONING_MODEL=${GEMINI_REASONING_MODEL:-gemini-2.5-pro}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-orca_user}:${POSTGRES_PASSWORD:-orca_secure_password}@postgres:5432/${POSTGRES_DB:-orca_marine}
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orca-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  orca_pgdata:
